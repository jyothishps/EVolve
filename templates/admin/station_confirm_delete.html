{% extends 'base.html' %}
{% block title %}Delete Station{% endblock %}

{% block content %}
<h2>Delete Station</h2>
<p>Are you sure you want to delete <strong>{{ station.name }} ({{ station.station_code }})</strong>? This will also delete related chargers, slots, and bookings.</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, Delete</button>
    <a href="{% url 'core:station_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
