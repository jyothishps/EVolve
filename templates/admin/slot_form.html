{% extends 'base.html' %}
{% block title %}{{ action }} Slot{% endblock %}

{% block content %}
<h2>{{ action }} Slot</h2>

<form method="post">
    {% csrf_token %}
    {% for field in form %}
        <div class="mb-3">
            <label class="form-label">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
                <div class="text-danger small">{{ field.errors|join:", " }}</div>
            {% endif %}
        </div>
    {% endfor %}
    <button type="submit" class="btn btn-success">Save</button>
    <a href="{% url 'core:slot_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
